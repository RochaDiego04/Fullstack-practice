services:
  postgres-test:
    image: postgres:16-alpine
    container_name: cashtrackr_postgres_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: cashtrackr
      POSTGRES_PASSWORD: cashtrackr
      POSTGRES_DB: cashtrackr_test
    ports:
      - "5433:5432"
    volumes:
      - cashtrackr_postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashtrackr -d cashtrackr_test"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  cashtrackr_postgres_test_data:
